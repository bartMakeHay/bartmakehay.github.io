<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 935 484" width="935" height="484" role="img" aria-labelledby="t d">
<title id="t">Long-term memory, working memory, and the feedback loop</title>
<desc id="d">How a deliberately scoped task file is assembled from the vault, and how the reusable pattern flows back into it.</desc>
