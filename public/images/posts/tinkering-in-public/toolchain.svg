  .rel{fill:#4a4a48;font-size:10.5px;}
  .macro{fill:#7a7872;font-size:8.7px;}
  .voet{fill:#8c8a82;font-size:10px;}
  .ln{stroke:#5A5A5A;stroke-width:1.4;fill:none;}
</style>
