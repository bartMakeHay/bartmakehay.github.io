<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 576" width="792" height="576" role="img" aria-labelledby="t d">
<title id="t">How this blog comes together</title>
<desc id="d">Business layer top and bottom: 'Relentless blogging' receives from Vault management (Obsidian) and Editing (Claude, in 'Blog support'); 'Blog consultation' receives from the deployed site. Obsidian/GitHub/Claude form the technology/application layer in between; GitHub also carries the Deploy process that publishes to GitHub Pages.</desc>
