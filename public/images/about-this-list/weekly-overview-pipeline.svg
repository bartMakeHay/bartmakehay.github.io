<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 460" width="823" height="460" role="img" aria-labelledby="t d">
<title id="t">How the weekly topic overview comes together</title>
<desc id="d">A small production chain: a person's own reflection becomes notes, an AI-assisted routine drafts a topic card from them, a script turns that card into structured topic data, and the website reads that data to show a weekly overview to a reader.</desc>
