  .kop{fill:#1A1A1A;font-size:12px;font-weight:700;}
  .lbl{fill:#1A1A1A;font-size:11.5px;}
  .ttl{fill:#2c2c2a;font-size:15px;font-weight:700;}
  .ttl-suffix{fill:#8c8a82;font-size:13px;font-weight:400;}
  .rel{fill:#4a4a48;font-size:10.5px;}
  .macro{fill:#7a7872;font-size:8.7px;}
  .voet{fill:#8c8a82;font-size:10px;}
  .ln{stroke:#5A5A5A;stroke-width:1.4;fill:none;}
</style>
